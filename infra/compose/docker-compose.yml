# Runs the whole local stack: Caddy -> frontend/backend -> Postgres (+ Valkey). Only Caddy is exposed.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seva}
      POSTGRES_DB: ${POSTGRES_DB:-seva}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seva} -d ${POSTGRES_DB:-seva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.0
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seva}:${POSTGRES_PASSWORD:-seva}@postgres:5432/${POSTGRES_DB:-seva}
      REDIS_URL: redis://valkey:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    # Healthy only when /api/health answers 200 (database and Valkey both reachable).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Background worker (SAQ). Same image as the backend, different command.
  worker:
    build:
      context: ../../backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    command: ["saq", "app.worker.settings"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seva}:${POSTGRES_PASSWORD:-seva}@postgres:5432/${POSTGRES_DB:-seva}
      REDIS_URL: redis://valkey:6379/0
    depends_on:
      # The backend runs the migrations first, so wait until it is healthy.
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend

  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  postgres_data:
