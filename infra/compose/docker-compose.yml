# Runs the whole local stack: Caddy -> frontend/backend -> Postgres (+ Valkey). Only Caddy is exposed.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seva}
      POSTGRES_DB: ${POSTGRES_DB:-seva}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seva} -d ${POSTGRES_DB:-seva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:9.0

  backend:
    build:
      context: ../../backend
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-seva}:${POSTGRES_PASSWORD:-seva}@postgres:5432/${POSTGRES_DB:-seva}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend

  caddy:
    image: caddy:2.11.7
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
