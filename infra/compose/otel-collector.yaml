# OpenTelemetry Collector: one relay for all telemetry. Apps and Caddy send here;
# the collector forwards to ONE destination set by env vars (local Grafana or Grafana Cloud).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318 # HTTP: Caddy, backend, and worker send here

processors:
  batch: {} # group items before sending: fewer, bigger requests
  # The invite page path holds a secret token (/invite/<token>). Caddy writes that path into
  # each span's name and "url.path", and Caddy cannot turn that off. So we rewrite the token
  # here, before any span leaves our machine (story 2.5). Anyone who can read traces must
  # never see a working invite link.
  transform/hide_invite_token:
    error_mode: ignore # a span this rule cannot read is sent on unchanged, not dropped
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["url.path"], "^/invite/[^/]+", "/invite/:token")
          - replace_pattern(name, "/invite/[^/ ]+", "/invite/:token")

exporters:
  otlp_http:
    # Default: the local Grafana container. For Grafana Cloud, set both vars in infra/compose/.env.
    endpoint: ${env:OTLP_EXPORT_ENDPOINT}
    headers:
      Authorization: ${env:OTLP_EXPORT_AUTH}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [transform/hide_invite_token, batch] # clean first, then batch
      exporters: [otlp_http]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http]
