# Ruff config for the whole repo (backend + evals).
target-version = "py314"
line-length = 120
# _bmad is third-party BMAD tooling, not our code.
extend-exclude = ["_bmad", "_bmad-output", "docs"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "TID251"]

# Raw SQL (text()) skips the tenant filter of the base repository (AD-3).
# Only app/core may use it; tests and migrations are exempt below.
[lint.flake8-tidy-imports.banned-api]
"sqlalchemy.text".msg = "Raw SQL skips the tenant filter. Use it only in app/core (AD-3)."
"sqlalchemy.sql.text".msg = "Raw SQL skips the tenant filter. Use it only in app/core (AD-3)."
"sqlalchemy.sql.expression.text".msg = "Raw SQL skips the tenant filter. Use it only in app/core (AD-3)."
"sqlalchemy.TextClause".msg = "Raw SQL skips the tenant filter. Use it only in app/core (AD-3)."
"sqlalchemy.sql.elements.TextClause".msg = "Raw SQL skips the tenant filter. Use it only in app/core (AD-3)."
"sqlalchemy.sql.expression.TextClause".msg = "Raw SQL skips the tenant filter. Use it only in app/core (AD-3)."

[lint.per-file-ignores]
"backend/app/core/**" = ["TID251"]
"backend/tests/**" = ["TID251"]
"backend/migrations/**" = ["TID251"]

[lint.isort]
known-first-party = ["app", "evals"]
