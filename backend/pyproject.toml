[project]
name = "sevadesk-backend"
version = "0.1.0"
description = "SevaDesk backend: FastAPI API and SAQ worker"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "redis==7.4.1",
    "saq[redis]==0.26.5",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "testcontainers[postgres,valkey]==4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
