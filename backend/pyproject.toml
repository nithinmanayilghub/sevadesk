[project]
name = "sevadesk-backend"
version = "0.1.0"
description = "SevaDesk backend: FastAPI API and SAQ worker"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "redis==7.4.1",
    "saq[redis]==0.26.5",
    "sqlalchemy==2.1.6",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "import-linter==2.15",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "testcontainers[postgres,valkey]==4.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Import rules (AD-2): core must not depend on any entry point.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "core depends on no entry point"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = ["app.main", "app.worker", "app.export_openapi"]

# Coverage gate: CI fails if less than 80% of the app code is run by tests.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
